{% extends "base.html" %}

{% block extra_css %}
<style>
    .auth-wrapper {
        min-height: calc(100vh - 180px);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 3rem 1rem;
    }
    .auth-card {
        border-radius: 20px;
        box-shadow: var(--shadow);
        overflow: hidden;
        border: 1px solid var(--border-color);
        max-width: 440px;
        width: 100%;
        background: var(--bg-card) !important;
    }
    .auth-header {
        background: var(--accent-gradient);
        color: white;
        padding: 2.2rem 2rem;
        text-align: center;
    }
    .auth-header i {
        font-size: 2.8rem;
        margin-bottom: 0.75rem;
    }
    .auth-body {
        padding: 2.5rem 2rem;
    }
    .demo-credentials-badge {
        background: rgba(102, 126, 234, 0.1);
        border: 1px dashed var(--accent);
        border-radius: 12px;
        padding: 0.8rem 1rem;
        margin-top: 1.5rem;
        font-size: 0.85rem;
    }
</style>
{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <div class="card auth-card">
        <div class="auth-header">
            <i class="fas fa-shield-alt"></i>
            <h3 class="fw-bold mb-1">Welcome Back</h3>
            <p class="mb-0 opacity-75 small">Sign in to your Visual Risk &amp; Intelligence portal</p>
        </div>
        <div class="auth-body">
            <form method="POST" action="{{ url_for('login') }}">
                <div class="mb-3">
                    <label class="form-label fw-semibold small text-muted">Username</label>
                    <div class="input-group">
                        <span class="input-group-text bg-transparent border-end-0"><i class="fas fa-user text-muted"></i></span>
                        <input type="text" name="username" class="form-control border-start-0 ps-0" placeholder="Enter your username" required autofocus>
                    </div>
                </div>

                <div class="mb-4">
                    <div class="d-flex justify-content-between align-items-center mb-1">
                        <label class="form-label fw-semibold small text-muted mb-0">Password</label>
                    </div>
                    <div class="input-group">
                        <span class="input-group-text bg-transparent border-end-0"><i class="fas fa-lock text-muted"></i></span>
                        <input type="password" name="password" class="form-control border-start-0 ps-0" placeholder="Enter your password" required>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold shadow-sm">
                    <i class="fas fa-sign-in-alt me-1"></i> Sign In
                </button>
            </form>

            <div class="demo-credentials-badge text-center">
                <i class="fas fa-info-circle text-primary me-1"></i>
                <strong>Default Admin:</strong> <code>admin</code> | <strong>Password:</strong> <code>admin123</code>
            </div>

            <div class="text-center mt-4">
                <span class="text-muted small">Don't have an account?</span>
                <a href="{{ url_for('register') }}" class="small fw-semibold text-decoration-none ms-1" style="color: var(--accent);">Create Account</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
